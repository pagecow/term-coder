<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Term Code</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">

    <!-- COLUMN 1 — Projects (left sidebar) -->
    <aside class="col-projects pane">
      <header class="pane-titlebar">
        <div>
          <span class="eyebrow">Projects</span>
          <strong>Term Code</strong>
        </div>
        <button id="new-project-btn" class="icon-button" type="button" title="New project" aria-label="New project">+ New Project</button>
      </header>
      <nav id="project-list" class="project-list" aria-label="Projects">
        <!-- app.js fills this with .project-item elements -->
      </nav>
    </aside>

    <!-- COLUMN 2 — AI chat (middle) -->
    <section class="col-chat pane">
      <header class="pane-titlebar chat-titlebar">
        <div class="chat-title-left">
          <span class="eyebrow">Orchestrator</span>
          <strong id="chat-title">Ask the agent</strong>
        </div>
        <div class="chat-title-right">
          <select id="model-picker" class="model-picker" aria-label="Model"></select>
          <select id="effort-picker" class="effort-picker hidden" aria-label="Reasoning effort" title="Reasoning effort"></select>
          <button id="attach-board-btn" class="btn" type="button" title="Attach a Kanban board">Attach Board</button>
          <span id="attached-board-name" class="attached-board-name" title="Attached board">No board</span>
        </div>
      </header>

      <div id="chat-log" class="chat-log" aria-live="polite">
        <!-- app.js fills this with .msg rows: .msg.user / .msg.assistant / .msg.system / .msg.tool, and .msg-thinking -->
      </div>

      <div id="chat-status" class="chat-status" aria-live="polite"></div>

      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" class="chat-input" placeholder="Ask the orchestrator to build something…" rows="2"></textarea>
        <button id="send-btn" type="submit" class="btn btn-primary send-button">Send</button>
      </form>

      <div id="session-info" class="session-info"></div>
    </section>

    <!-- COLUMN 3 — Terminals (right) -->
    <section class="col-terminals pane">
      <header class="pane-titlebar">
        <div>
          <span class="eyebrow">Terminals</span>
          <strong>Sessions</strong>
        </div>
      </header>

      <div id="term-tabs" class="term-tabs" role="tablist">
        <!-- app.js adds .term-tab buttons here -->
      </div>

      <div id="term-host" class="term-host">
        <div class="term-empty">No active sessions. Ask the orchestrator to build something, or start one manually below.</div>
      </div>

      <form id="manual-session-form" class="manual-session-form">
        <select id="manual-cli" class="manual-cli" aria-label="CLI">
          <option value="codex">codex</option>
          <option value="claude">claude</option>
        </select>
        <input id="manual-cwd" class="manual-cwd" type="text" placeholder="worktree or project path (blank = selected project)" />
        <button id="manual-start-btn" class="btn btn-primary" type="submit">Start session</button>
      </form>
    </section>

  </main>

  <div id="app-loading" class="app-loading">Loading…</div>

  <script type="module" src="app.js"></script>
</body>
</html>
